[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-transcriber-action-extractor"
version = "1.0.0"
description = "High-performance meeting transcription and action-item extractor with owner and deadline resolution powered by faster-whisper, Gemini, and Ollama."
readme = "README.md"
authors = [
  { name = "Vecesta.co", email = "vecesta.co@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
  "speech-to-text",
  "whisper",
  "faster-whisper",
  "meeting-transcription",
  "action-items",
  "summarization",
  "diarization",
  "vecesta"
]
dependencies = [
  "pydantic>=2.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]

[project.scripts]
meeting-transcriber = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -v"

